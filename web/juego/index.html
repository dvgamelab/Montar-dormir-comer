<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffcb2e">
<!--CUERPO-->
<title>Palomazo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Tebeo de barrio: tinta gruesa, papel amarillento, sombras de pegatina. Columna de móvil a pantalla completa. */
:root{
  --tinta:#1d1426; --papel:#fff4dc; --papel2:#f6e6c2; --mostaza:#ffcb2e; --chicle:#ff4f8b;
  --menta:#2ec4a0; --azul:#3a5bff; --lila:#a64dff; --oro:#ffb800;
  --display:"Bowlby One","Arial Black",Impact,system-ui,sans-serif;
  --texto:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--tinta);color:var(--tinta);font-family:var(--texto);font-size:15px;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  background:var(--papel);overflow:hidden}

/* HUD */
#hud{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--mostaza);border-bottom:3px solid var(--tinta)}
.lvl{flex:none;width:42px;height:42px;border-radius:50%;background:var(--chicle);color:var(--papel);
  border:3px solid var(--tinta);display:grid;place-items:center;font-family:var(--display);font-size:17px;line-height:1;
  box-shadow:2px 2px 0 var(--tinta)}
.lvl>div{display:flex;flex-direction:column;align-items:center;gap:1px}
.lvl small{display:block;font-family:var(--texto);font-size:8px;font-weight:800;letter-spacing:.08em;line-height:1}
.xpwrap{flex:1;min-width:0}
.logo{font-family:var(--display);font-size:19px;line-height:1;letter-spacing:.01em}
.logo span{color:var(--chicle);-webkit-text-stroke:0}
.xpbar{height:10px;border:2px solid var(--tinta);border-radius:6px;background:var(--papel);margin-top:4px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:var(--menta);transition:width .5s}
.pill{flex:none;display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums}
.pill b{font-family:var(--display);font-size:16px;line-height:1}
.pill small{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
#snd{flex:none;width:34px;height:34px;border:2px solid var(--tinta);border-radius:8px;background:var(--papel);font-weight:800;font-size:11px;padding:0}

/* Pantallas */
main{position:relative;flex:1;min-height:0}
.scr{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#scr-hunt{overflow:hidden;touch-action:none}
#cv{display:block;width:100%;height:100%;touch-action:none}
.pad{padding:16px 16px 24px}

/* Bandeja de objetos durante la caza */
.tray{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;
  padding:0 10px 10px;pointer-events:none}
.slot{pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--papel);border:3px solid var(--tinta);
  border-radius:12px;padding:4px 8px 4px 4px;box-shadow:3px 3px 0 var(--tinta);min-width:0;max-width:44%}
.slot:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tinta)}
.slot canvas{flex:none;width:34px;height:34px}
.slot .t{display:flex;flex-direction:column;text-align:left;line-height:1.1;min-width:0}
.slot .t b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .t small{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.slot.off{opacity:.55}
.topbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.chip{border:2px solid var(--tinta);background:var(--papel);border-radius:999px;padding:4px 10px;font-weight:800;font-size:12px;box-shadow:2px 2px 0 var(--tinta)}
.chip:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--tinta)}
#regen{position:absolute;top:10px;left:10px;font-size:11px;font-weight:800;background:rgba(255,244,220,.85);border:2px solid var(--tinta);
  border-radius:8px;padding:3px 7px;font-variant-numeric:tabular-nums}

/* Nav */
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--tinta);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;color:var(--papel);padding:10px 4px 9px;font-family:var(--display);font-size:13px;letter-spacing:.02em;position:relative}
nav button.on{color:var(--mostaza)}
nav button.on::after{content:"";position:absolute;left:28%;right:28%;bottom:4px;height:4px;border-radius:2px;background:var(--chicle)}
nav .badge{position:absolute;top:5px;right:16%;background:var(--chicle);color:var(--papel);font-family:var(--texto);font-size:10px;font-weight:800;border-radius:999px;padding:0 5px}

/* Titulares de sección */
h2{font-family:var(--display);font-size:26px;line-height:1.05;margin:0 0 4px;text-wrap:balance;font-weight:400}
.sub{margin:0 0 14px;font-size:14px;color:#5b4a52}

/* Zonas */
.zones{display:grid;gap:12px}
.zone{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center;text-align:left;background:var(--papel);
  border:3px solid var(--tinta);border-radius:14px;padding:8px;box-shadow:4px 4px 0 var(--tinta)}
.zone canvas{width:84px;height:64px;border:2px solid var(--tinta);border-radius:8px;display:block}
.zone b{font-family:var(--display);font-size:17px;font-weight:400;display:block}
.zone small{font-size:12px;color:#5b4a52;display:block;margin-top:2px}
.zone.here{background:var(--mostaza)}
.zone.lock{filter:grayscale(1);opacity:.6}
.zone:not(.lock):active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--tinta)}

/* Álbum */
.albtop{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cromo{position:relative;background:var(--papel);border:3px solid var(--tinta);border-radius:10px;padding:0 0 6px;text-align:center;
  box-shadow:3px 3px 0 var(--tinta);overflow:hidden;min-width:0}
.cromo canvas{display:block;width:100%;aspect-ratio:1/1;max-width:100%}
.cromo .band{height:6px}
.cromo b{display:block;font-size:11px;line-height:1.15;padding:0 4px;min-height:2.3em;text-wrap:balance}
.cromo .n{position:absolute;top:9px;left:5px;font-size:10px;font-weight:800;color:#5b4a52;font-variant-numeric:tabular-nums}
.cromo .x{position:absolute;top:9px;right:5px;font-size:11px;font-weight:800;background:var(--tinta);color:var(--papel);border-radius:6px;padding:0 5px}
.cromo .gold{position:absolute;top:26px;right:5px;font-size:10px;font-weight:800;background:var(--oro);border:2px solid var(--tinta);border-radius:6px;padding:0 4px}
.cromo.unk b{color:#8a7a80}

/* Tienda */
.shop{display:grid;gap:10px}
.item{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;background:var(--papel);border:3px solid var(--tinta);
  border-radius:12px;padding:8px 10px;box-shadow:3px 3px 0 var(--tinta)}
.item canvas{width:48px;height:48px}
.item b{display:block;font-size:14px}
.item small{display:block;font-size:12px;color:#5b4a52;line-height:1.3}
.item .own{font-weight:800;color:var(--tinta)}
.buy{border:3px solid var(--tinta);background:var(--menta);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13px;
  box-shadow:2px 2px 0 var(--tinta);white-space:nowrap;font-variant-numeric:tabular-nums}
.buy:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--tinta)}
.buy:disabled{background:var(--papel2);opacity:.6}
.shoph{font-family:var(--display);font-size:15px;font-weight:400;margin:14px 0 2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{border:2px dashed var(--tinta);border-radius:10px;padding:8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:20px;font-weight:400;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;font-weight:600}

/* Botones grandes */
.big{display:block;width:100%;border:3px solid var(--tinta);background:var(--chicle);color:var(--papel);border-radius:14px;padding:12px;
  font-family:var(--display);font-size:18px;box-shadow:4px 4px 0 var(--tinta);letter-spacing:.02em}
.big:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--tinta)}
.big.alt{background:var(--papel);color:var(--tinta)}
.small-btn{border:2px solid var(--tinta);background:var(--mostaza);border-radius:10px;padding:6px 10px;font-weight:800;font-size:12px;box-shadow:2px 2px 0 var(--tinta)}
.small-btn:disabled{opacity:.5}

/* Modal */
#modal{position:absolute;inset:0;background:rgba(29,20,38,.72);display:grid;place-items:center;padding:16px;z-index:10}
.card{width:100%;max-width:360px;background:var(--papel);border:4px solid var(--tinta);border-radius:18px;padding:16px;
  box-shadow:6px 6px 0 var(--chicle);text-align:center;position:relative;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.card h3{font-family:var(--display);font-weight:400;font-size:30px;line-height:1;margin:4px 0 6px;text-wrap:balance}
.card .pic{width:180px;height:180px;margin:0 auto;display:block;max-width:100%}
.card .rar{display:inline-block;border:2px solid var(--tinta);border-radius:999px;padding:2px 10px;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.card .desc{font-size:14px;line-height:1.4;margin:10px 0;color:#3b2f47}
.card .rw{display:grid;gap:4px;margin:10px 0 14px;font-weight:800;font-variant-numeric:tabular-nums}
.card .rw div{display:flex;justify-content:space-between;border-bottom:2px dotted #cdb893;padding:3px 0;font-size:14px}
.card .actions{display:grid;gap:10px}
.stamp{position:absolute;top:18px;right:-8px;transform:rotate(14deg);background:var(--chicle);color:var(--papel);border:3px solid var(--tinta);
  font-family:var(--display);font-size:16px;padding:2px 10px;border-radius:6px}
.stamp.gold{background:var(--oro);color:var(--tinta);top:56px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{border:2px solid var(--tinta);border-radius:10px;padding:6px}
.kv b{display:block;font-family:var(--display);font-weight:400;font-size:18px}
.kv small{font-size:11px;font-weight:600}

/* Aviso flotante */
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--tinta);color:var(--papel);padding:8px 14px;border-radius:10px;
  font-weight:800;font-size:13px;z-index:20;pointer-events:none;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){.card{animation:none}.xpbar i{transition:none}}
</style>
<!--/CABECERA-->
</head>
<body>
<!--INICIO-->
<div id="app">
  <header id="hud">
    <div class="lvl" aria-label="Nivel"><div><small>NIV</small><span id="lvl">1</span></div></div>
    <div class="xpwrap">
      <div class="logo">PALOMA<span>ZO</span></div>
      <div class="xpbar" aria-hidden="true"><i id="xp"></i></div>
    </div>
    <div class="pill"><b id="migas">0</b><small>migas</small></div>
    <div class="pill"><b id="racha">0</b><small>racha</small></div>
    <button id="snd" aria-label="Sonido">SON</button>
  </header>
  <main>
    <section class="scr" id="scr-hunt">
      <canvas id="cv"></canvas>
      <div id="regen"></div>
      <div class="topbtns"><button class="chip" id="skip">Pasar de ella</button></div>
      <div class="tray">
        <button class="slot" id="bagSlot" aria-label="Cambiar bolsa"><canvas width="68" height="68"></canvas><span class="t"><b></b><small></small></span></button>
        <button class="slot" id="baitSlot" aria-label="Cambiar cebo"><canvas width="68" height="68"></canvas><span class="t"><b></b><small></small></span></button>
      </div>
    </section>
    <section class="scr" id="scr-zones" hidden><div class="pad">
      <h2>Zonas del barrio</h2><p class="sub">Cada zona tiene su fauna. Subes de nivel pillando palomas y se abren sitios más turbios.</p>
      <div class="zones" id="zones"></div>
    </div></section>
    <section class="scr" id="scr-album" hidden><div class="pad">
      <div class="albtop"><div><h2>Álbum de cromos</h2><p class="sub" id="albsub" style="margin:0"></p></div>
      <button class="small-btn" id="sell">Vender repes</button></div>
      <div class="grid" id="grid"></div>
      <div class="stats" id="stats"></div>
    </div></section>
    <section class="scr" id="scr-shop" hidden><div class="pad">
      <h2>El chino de abajo</h2><p class="sub">Abierto 24 horas. Se paga en migas.</p>
      <div class="shop" id="shop"></div>
    </div></section>
  </main>
  <nav>
    <button data-s="hunt" class="on">Cazar</button>
    <button data-s="zones">Zonas</button>
    <button data-s="album">Álbum<span class="badge" id="newb" hidden></span></button>
    <button data-s="shop">Tienda</button>
  </nav>
  <div id="modal" hidden></div>
  <div id="toast" hidden></div>
</div>

<script>
"use strict";
/* ============ DATOS ============ */
const RAR={
  c:{n:"Común",col:"#b9ad9b",w:62,xp:100,m:15,base:"c"},
  r:{n:"Rara",col:"#3a5bff",w:27,xp:300,m:45},
  e:{n:"Épica",col:"#a64dff",w:9,xp:800,m:120},
  l:{n:"Legendaria",col:"#ffb800",w:2,xp:2500,m:500}
};
const GRIS={body:"#9aa3b5",wing:"#7c849a",neck:"#5fbf9f",neck2:"#a66bd6",beak:"#e89a4e",leg:"#ff8a8a"};
const L=(o)=>Object.assign({},GRIS,{size:1,fat:1,acc:[]},o);
const SPECIES=[
  // Parque del barrio
  {id:"currante",n:"Paloma Currante",r:"c",z:"parque",base:.45,flee:.1,spd:.35,dodge:.05,look:L({acc:["casco"]}),d:"Lleva treinta años picoteando el mismo banco. No ha cogido vacaciones nunca."},
  {id:"coja",n:"Paloma Coja",r:"c",z:"parque",base:.42,flee:.12,spd:.55,dodge:.12,look:L({body:"#8f97a8",acc:["coja"]}),d:"Le falta una pata y aun así te gana a la carrera."},
  {id:"gorrion",n:"Gorrión Chulo",r:"c",z:"parque",base:.38,flee:.18,spd:.8,dodge:.2,look:L({size:.72,body:"#a5774a",wing:"#6e4a2a",neck:"#d8c3a0",neck2:"#b89a70",beak:"#3b2f2f",acc:["gorra"]}),d:"Pequeño, rápido y con la gorra hacia atrás. Te mira como si le debieras dinero."},
  {id:"resaca",n:"Paloma de Resaca",r:"r",z:"parque",base:.26,flee:.15,spd:.2,dodge:.05,look:L({body:"#a9a1b8",acc:["gafas","ojosRojos"]}),d:"Anoche cerró la discoteca. Hoy solo quiere sombra y un bocadillo de tortilla."},
  {id:"cotorra",n:"Cotorra Okupa",r:"r",z:"parque",base:.22,flee:.22,spd:.7,dodge:.25,look:L({body:"#5cc75a",wing:"#2e8f3a",neck:"#c9d6c4",neck2:"#9fb59a",beak:"#ff9f3d",acc:["cresta"]}),d:"Ha okupado tres pinos y un transformador. Grita a las seis de la mañana por deporte."},
  {id:"punki",n:"Paloma Punki",r:"e",z:"parque",base:.13,flee:.28,spd:.6,dodge:.3,look:L({body:"#6f6a7d",acc:["cresta2","imperdible"]}),d:"No cree en el sistema. Tampoco en las bolsas del súper."},
  // Plaza Mayor
  {id:"obesa",n:"Paloma Obesa",r:"c",z:"plaza",base:.5,flee:.06,spd:.15,dodge:0,look:L({fat:1.45,size:1.1}),d:"Vive de los bocadillos de calamares de los turistas. Colesterol: sí."},
  {id:"guiri",n:"Paloma Guiri",r:"c",z:"plaza",base:.4,flee:.12,spd:.4,dodge:.08,look:L({body:"#f2a9a0",wing:"#d98a80",acc:["sombrero","calcetines","rinonera"]}),d:"Chanclas con calcetines y quemada a las once de la mañana. Pide paella a las siete de la tarde."},
  {id:"mimo",n:"Paloma Mimo",r:"r",z:"plaza",base:.24,flee:.2,spd:.05,dodge:.45,look:L({body:"#f4f4f4",wing:"#d9d9d9",acc:["rayas","boina","caraBlanca"]}),d:"No se mueve nada. Justo hasta que lanzas."},
  {id:"carterista",n:"Paloma Carterista",r:"e",z:"plaza",base:.12,flee:.35,spd:.9,dodge:.4,look:L({body:"#5c5f6e",wing:"#3e4150",acc:["antifaz"]}),d:"Te ha quitado la cartera mientras leías esto."},
  {id:"hacienda",n:"Paloma Mensajera de Hacienda",r:"l",z:"plaza",base:.05,flee:.45,spd:.6,dodge:.35,look:L({body:"#dcdcdc",wing:"#b0b0b0",acc:["carta","gafasPasta"]}),d:"Trae una notificación a tu nombre. Nadie quiere pillarla y todos acaban pillándola."},
  // Playa de Cádiz
  {id:"gaviota",n:"Gaviota Macarra",r:"c",z:"playa",base:.38,flee:.15,spd:.55,dodge:.15,look:L({size:1.15,body:"#f7f7f7",wing:"#9aa6b2",neck:"#f7f7f7",neck2:"#f0f0f0",beak:"#ffd23f",beakLen:.5,acc:["cadena","palillo"]}),d:"Roba bocatas con violencia gratuita. Se ha llevado un bocadillo entero."},
  {id:"socorrista",n:"Gaviota Socorrista",r:"r",z:"playa",base:.24,flee:.2,spd:.5,dodge:.2,look:L({size:1.1,body:"#ff5d5d",wing:"#9aa6b2",neck:"#f7f7f7",neck2:"#f0f0f0",beak:"#ffd23f",beakLen:.5,acc:["silbato","gafas"]}),d:"Pita a todo el mundo. No sabe nadar."},
  {id:"chiringuito",n:"Paloma Chiringuitera",r:"r",z:"playa",base:.25,flee:.18,spd:.35,dodge:.1,look:L({body:"#9aa3b5",acc:["delantal","palillo"]}),d:"Te cobra ocho euros por una caña caliente y encima te pone mala cara."},
  {id:"cunada",n:"Gaviota Cuñada",r:"e",z:"playa",base:.12,flee:.3,spd:.45,dodge:.3,look:L({size:1.2,body:"#f7f7f7",wing:"#9aa6b2",neck:"#f7f7f7",neck2:"#f0f0f0",beak:"#ffd23f",beakLen:.5,acc:["bigote","polo"]}),d:"Sabe más que tú de todo, sobre todo de lo que no sabe. Tiene una opinión sobre tu bolsa."},
  // Feria y botellón
  {id:"choni",n:"Paloma Choni",r:"c",z:"feria",base:.4,flee:.14,spd:.5,dodge:.12,look:L({body:"#ff8fc7",wing:"#e05fa0",acc:["aros","pestanas"]}),d:"Aros más grandes que la cabeza. Te llama «cari» antes de cagarte encima."},
  {id:"regueton",n:"Paloma Reguetonera",r:"r",z:"feria",base:.23,flee:.2,spd:.65,dodge:.25,look:L({body:"#3f3a52",wing:"#2a2638",acc:["gafas","cadena","gorra"]}),d:"Lleva el altavoz en la mochila a todo volumen. Solo tiene una canción."},
  {id:"tuning",n:"Paloma Tuning",r:"e",z:"feria",base:.12,flee:.32,spd:1,dodge:.35,look:L({body:"#ffe14d",wing:"#2a2a2a",acc:["neon","aleron","gafas"]}),d:"Neones en las patas y alerón en la cola. Hace trompos en el aparcamiento de la feria."},
  {id:"dj",n:"Paloma DJ",r:"e",z:"feria",base:.13,flee:.28,spd:.4,dodge:.35,look:L({body:"#6d5bd0",wing:"#4a3a9e",acc:["cascos","gafas"]}),d:"Pincha los jueves en un bar donde no va nadie. Te pasa un flyer."},
  {id:"rey",n:"Pichón Rey",r:"l",z:"feria",base:.05,flee:.45,spd:.3,dodge:.3,look:L({size:1.25,fat:1.2,acc:["capa","corona"]}),d:"Rey de todas las palomas. Jamás ha pagado un impuesto. Ni una multa."},
  // Central nuclear

const cv=$("#cv"),ctx=cv.getContext("2d");

function resize(){
  const r=cv.getBoundingClientRect();if(!r.width||!r.height)return;
  DPR=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);

}
function baitObj(){return BT[S.bait||"none"]}
function mults(){
  const b=bird;if(!b)return 1;

}
const pOf=(base,m)=>1-Math.pow(1-base,m);
function spawn(){

    scale:1,alpha:1,state:"enter",t:0,angryT:0};

function banner(txt,col,dur=1.4,y){fx.push({kind:"banner",txt,col,t:0,dur,y:y??H*.14})}
function pop(txt,x,y,col="#fff",size=22,dur=1){fx.push({kind:"pop",txt,x,y,col,size,t:0,dur})}

function addSplat(big){
  const s={x:W*(.15+rnd()*.7),y:H*(.18+rnd()*.5),r:(big?1.3:1)*UNIT*(1+rnd()*.6),a:1,seed:rnd()*100,blobs:[]};
  for(let i=0;i<9;i++){const a=i/9*Math.PI*2+rnd()*.5;s.blobs.push([Math.cos(a)*s.r*(.6+rnd()*.5),Math.sin(a)*s.r*(.6+rnd()*.5),s.r*(.25+rnd()*.25)])}

function drawSplat(c,s){

function ringP(){return bird?pOf(bird.sp.base,mults()):0}
function ringCol(p){return p>=.5?"#2ec45a":p>=.3?"#ffd000":p>=.15?"#ff8a00":"#ff2e3b"}

function update(dt){
  const b=bird;if(!b)return;
  b.t+=dt;pT+=dt;
  if(phase==="enter"){b.y=lerp(-UNIT*3,GY,ease(Math.min(1,pT/.8)));if(pT>=.8){b.y=GY;phase="aim";pT=0}}
  if(phase==="aim"||phase==="fly"){
    const calm=baitObj().calm;
    b.nextMove-=dt;
    if(b.nextMove<=0){b.tx=W*(.18+rnd()*.64);b.nextMove=(.8+rnd()*2.2)/(.4+b.sp.spd)}
    const speed=b.sp.spd*W*.32*calm*(1+b.anger*.2);
    const dx=b.tx-b.x;
    if(Math.abs(dx)>2&&speed>1){b.x+=Math.sign(dx)*Math.min(Math.abs(dx),speed*dt);b.dir=Math.sign(dx);b.walk=true}else b.walk=false;
    if(b.hopT>0){b.hopT-=dt;b.x+=b.hopVx*dt;b.walk=false}
    b.x=clamp(b.x,W*.12,W*.88);
    if(b.angryT>0)b.angryT-=dt;
  }
  if(phase==="fly"&&thr){
    thr.t+=dt;
    if(thr.dodgeAt!=null&&thr.t>=thr.dodgeAt){thr.dodgeAt=null;const dirX=b.x>W/2?-1:1;b.hopT=.28;b.hopVx=dirX*b.u*6.5;pop("¡AMAGO!",b.x,GY-b.u*3,"#fff",20)}
    if(thr.t>=thr.T){
      const dx=Math.abs(thr.x1-b.x),hitR=b.u*1.3;
      if(thr.weak){missThrow("¡Flojo!")}
      else if(dx<hitR){hit(dx/hitR)}
      else missThrow(rnd()<.5?"¡Fallo!":"¡Ni cerca!");
    }
  }
  if(phase==="suck"){if(pT>=.45){phase="drop";pT=0}}
  if(phase==="drop"){cap.y=lerp(cap.y0,GY-cap.s*.5,ease(Math.min(1,pT/.3)));if(pT>=.35){phase="wobble";pT=0;cap.w=0;SFX.wobble();vib(30)}}
  if(phase==="wobble"){
    const per=.8,k=Math.floor(pT/per);
    if(k>cap.w){
      cap.w=k;
      if(cap.failAt>=0&&k>cap.failAt)return breakOut();
      if(k>=cap.need)return caught();
      SFX.wobble();vib(30);
    }
  }
  if(phase==="break"){if(pT>=.7){if(cap.flee){fleeStart()}else{phase="aim";pT=0}}}
  if(phase==="flee"){b.y-=dt*H*.9;b.x+=dt*W*.5*(b.x>W/2?1:-1);if(pT>1.2){phase="gone";pT=0;S.stats.fled++;save();pendingTimer=setTimeout(spawn,900)}}
  if(phase==="caught"){if(pT>=1.1&&!cap.shown){cap.shown=true;showCaught()}}
}
function hit(off){
  const b=bird;

  let m=mults()*thr.q.m*(center?1.2:1);
  const p=pOf(b.sp.base,m);
  const crit=thr.q.m>=1.6&&rnd()<(.06+(thr.q.m-1.6)*.2);
  const need=crit?1:3;const per=Math.pow(p,1/need);
  let failAt=-1;for(let i=0;i<need;i++){if(rnd()>per){failAt=i;break}}
  cap={x:thr.x1,y:thr.y1,y0:thr.y1,s:UNIT*1.1,need,failAt,crit,p,w:0,bag:thr.bag,q:thr.q,center};

    <div class="actions"><button class="big" id="mNext">Seguir cazando</button></div>`,
  ()=>{if(S.lvl>lvBefore)levelUp(lvBefore);else spawn()});

}
function gainXP(x){S.xp+=x;while(S.xp>=need(S.lvl)){S.xp-=need(S.lvl);S.lvl++}}
function levelUp(from){

    <div class="actions">${unlocked.length?`<button class="big" id="mGo">Ir a ${unlocked[unlocked.length-1].n}</button>`:""}<button class="big ${unlocked.length?"alt":""}" id="mOk">Seguir cazando</button></div>`,

  const g=$("#mGo");if(g)g.onclick=()=>{S.zone=unlocked[unlocked.length-1].id;save();resize();closeModal()};

/* Lanzamiento */
function throwQuality(){
  const b=bird;const k=.5+.5*Math.cos(b.t*2.4);const q=1-k;
  if(q>.88)return{m:2,txt:"¡BRUTAL!",col:"#ffcb2e",xp:100,q};
  if(q>.65)return{m:1.6,txt:"¡GENIAL!",col:"#2ec4a0",xp:50,q};
  if(q>.35)return{m:1.3,txt:"¡BIEN!",col:"#fff",xp:20,q};
  return{m:1,txt:"",col:"#fff",xp:0,q};
}
function startX(){return W/2}
function startY(){return H-UNIT*2.4}
function canThrow(){return phase==="aim"&&bird}
function doThrow(vx,vy,x0,y0,drag=0){
  if((S.bags[S.bag]||0)<=0){toast("No te quedan. Cambia de bolsa o pasa por la tienda.");return false}
  S.bags[S.bag]--;S.stats.throws++;save();renderTray();
  const b=bird,speed=Math.hypot(vx,vy)/H;
  const targetY=GY-b.u*1;
  const x1=x0+(vx/-vy)*Math.max(0,y0-targetY);
  y0=Math.max(y0,GY+UNIT*.6);
  const weak=speed<.5&&drag<H*.12;
  const y1=weak?lerp(y0,targetY,.45):targetY;
  const q=throwQuality();
  const calm=baitObj().calm;
  const dodgeP=b.sp.dodge*(1+b.anger*.35)*(calm<.5?.3:1);
  thr={x0,y0,x1:weak?lerp(x0,x1,.45):x1,y1,t:0,T:weak?.4:.55,bag:S.bag,q,weak,rot:0,dodgeAt:(!weak&&rnd()<dodgeP)?.12+rnd()*.2:null};
  phase="fly";pT=0;SFX.throw();
  return true;
}

/* Render */
function render(){
  if(!W)return;
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bgC,0,0);ctx.setTransform(DPR,0,0,DPR,0,0);
  const b=bird;
  if(b){
    // sombra
    if(phase!=="flee"&&phase!=="gone"&&phase!=="suck"&&phase!=="drop"&&phase!=="wobble"&&phase!=="caught"){
      ctx.fillStyle="rgba(29,20,38,.2)";ell(ctx,b.x,GY+2,b.u*(b.sp.look.fat||1)*.9,b.u*.18);ctx.fill()}
    // anillo
    if(phase==="aim"||phase==="fly"){
      const cy=GY-b.u*1.05,R=b.u*1.15,k=.5+.5*Math.cos(b.t*2.4),p=ringP();
      ctx.lineWidth=3;ctx.strokeStyle="rgba(255,255,255,.9)";ell(ctx,b.x,cy,R*1.25,R*1.25*.55);ctx.stroke();
      ctx.lineWidth=5;ctx.strokeStyle=ringCol(p);ell(ctx,b.x,cy,R*1.25*(.2+.8*k),R*1.25*.55*(.2+.8*k));ctx.stroke();
    }
    let hop=b.hopT>0?-Math.sin((1-b.hopT/.28)*Math.PI)*b.u*.9:0;
    let sc=1,al=1,bx=b.x,by=b.y+hop;
    if(phase==="suck"&&cap){const k=Math.min(1,pT/.45);sc=1-k;bx=lerp(b.x,cap.x,k);by=lerp(GY,cap.y,k)}
    if(phase==="break"&&cap){const k=Math.min(1,pT/.3);sc=k;bx=lerp(cap.x,b.x,k);by=GY}
    const hidden=phase==="drop"||phase==="wobble"||phase==="caught";
    if(!hidden&&sc>.02){
      ctx.save();ctx.globalAlpha=al;ctx.translate(bx,by);ctx.scale(sc,sc);
      drawBird(ctx,b.sp,0,0,b.u,{t:b.t,walk:b.walk,face:b.dir,gold:b.gold,angry:b.angryT>0||b.anger>1,flap:phase==="enter"||phase==="flee"||b.hopT>0,dizzy:phase==="break"});
      ctx.restore();
      if(b.anger>0&&(phase==="aim"||phase==="fly")){ctx.fillStyle="#ff2e3b";ctx.font=`800 ${b.u*.5}px Rubik,sans-serif`;ctx.textAlign="center";ctx.fillText("#".repeat(b.anger),b.x+b.u*.9,GY-b.u*2.3)}
    }
    // bolsa capturando
    if(cap&&(phase==="suck"||phase==="drop"||phase==="wobble"||phase==="caught")){
      let rot=0;if(phase==="wobble"){const kk=(pT%.8)/.8;rot=kk<.55?Math.sin(kk/.55*Math.PI*2)*.35:0}
      let s=cap.s;if(phase==="suck")s*=1+Math.sin(pT*20)*.08;
      drawBag(ctx,cap.bag,cap.x,cap.y,s,rot);
      if(phase==="wobble"||phase==="caught"){ctx.fillStyle="#fff";ctx.strokeStyle=INK;ctx.lineWidth=2;
        for(let i=0;i<cap.need;i++){const x=cap.x-(cap.need-1)*9+i*18,y=cap.y+cap.s*.9;ell(ctx,x,y,6,6);ctx.fillStyle=i<cap.w||phase==="caught"?"#2ec45a":"#fff";ctx.fill();ctx.stroke()}}
      if(phase==="caught"){ctx.fillStyle="#ffcb2e";ctx.font=`800 ${UNIT*.5}px Rubik,sans-serif`;ctx.textAlign="center";for(let i=0;i<3;i++){const a=pT*3+i*2.1;ctx.fillText("★",cap.x+Math.cos(a)*cap.s,cap.y-cap.s*.2+Math.sin(a)*cap.s*.4)}}
    }
  }
  // bolsa en vuelo
  if(thr){
    const k=Math.min(1,thr.t/thr.T),x=lerp(thr.x0,thr.x1,k),y=lerp(thr.y0,thr.y1,k)-Math.sin(k*Math.PI)*H*(thr.weak?.08:.2);
    thr.rot=k*9;drawBag(ctx,thr.bag,x,y,UNIT*lerp(1.2,.95,k),thr.rot);
  }
  // bolsa en mano
  if(canThrow()&&!thr){
    const hx=holding?holding.x:startX(),hy=holding?holding.y:startY()+Math.sin(performance.now()/300)*4;
    if((S.bags[S.bag]||0)>0){drawBag(ctx,S.bag,hx,hy,UNIT*1.2,holding?Math.sin(performance.now()/80)*.1:0);
      if(S.bait){drawBait(ctx,S.bait,hx+UNIT*.9,hy-UNIT*.6,UNIT*.55)}}
    if(!holding&&S.stats.throws<4){ctx.fillStyle="#fff";ctx.strokeStyle=INK;ctx.lineWidth=4;ctx.font=`800 ${Math.max(13,UNIT*.34)}px Rubik,sans-serif`;ctx.textAlign="center";
      const ty=startY()-UNIT*1.3-Math.abs(Math.sin(performance.now()/350))*8;ctx.strokeText("Desliza hacia arriba para lanzar",W/2,ty);ctx.fillText("Desliza hacia arriba para lanzar",W/2,ty)}
  }
  // efectos
  for(const f of fx){
    if(f.kind==="fall"){const k=f.t/.6;ctx.globalAlpha=1-k;drawBag(ctx,f.bag,f.x,f.y+k*k*H*.25,UNIT*.9,f.rot+k*6);ctx.globalAlpha=1}
    else if(f.kind==="pop"){const k=f.t/f.dur;ctx.globalAlpha=k>.7?1-(k-.7)/.3:1;ctx.font=`${f.size*(k<.15?k/.15*1.2:1)}px "Bowlby One",Impact,sans-serif`;ctx.textAlign="center";
      ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.strokeText(f.txt,f.x,f.y-k*30);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y-k*30);ctx.globalAlpha=1}
    else if(f.kind==="banner"){const k=f.t/f.dur;const a=k<.12?k/.12:k>.8?1-(k-.8)/.2:1;ctx.globalAlpha=a;
      const size=Math.min(28,W/Math.max(10,f.txt.length*.62));ctx.font=`${size}px "Bowlby One",Impact,sans-serif`;ctx.textAlign="center";
      const tw=Math.min(W-24,ctx.measureText(f.txt).width+28);ctx.save();ctx.translate(W/2,f.y);ctx.rotate(-.03);
      ctx.fillStyle=f.col;ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.rect(-tw/2,-size*.95,tw,size*1.5);ctx.fill();ctx.stroke();
      ctx.fillStyle=f.col==="#ffcb2e"||f.col==="#b9ad9b"||f.col==="#ffb800"?INK:"#fff";ctx.fillText(f.txt,0,size*.2,tw-16);ctx.restore();ctx.globalAlpha=1}
  }
  for(const p of parts){const k=p.t/p.life;ctx.globalAlpha=1-k;ctx.fillStyle=p.col;
    if(p.star){ctx.font=`${p.r*4}px sans-serif`;ctx.textAlign="center";ctx.fillText("★",p.x,p.y)}else{ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1}
  for(const s of splats)drawSplat(ctx,s);
}
function tickFx(dt){
  for(const f of fx)f.t+=dt;fx=fx.filter(f=>f.t<(f.dur||.6));
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=500*dt}parts=parts.filter(p=>p.t<p.life);
  for(const s of splats){s.age=(s.age||0)+dt;if(s.age>14)s.a-=dt*.5}splats=splats.filter(s=>s.a>.05);
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(!$("#scr-hunt").hidden){update(dt);tickFx(dt);render()}
  regenTick();
  requestAnimationFrame(loop);
}

/* Entrada táctil */
let pts=[],wiping=false;
function pos(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,t:performance.now()}}
cv.addEventListener("pointerdown",e=>{
  ac();const p=pos(e);cv.setPointerCapture(e.pointerId);
  const onSplat=splats.find(s=>Math.hypot(s.x-p.x,s.y-p.y)<s.r*1.1);
  if(onSplat){wiping=true;pts=[p];return}
  if(!canThrow())return;
  if(p.y<H*.45)return;
  if((S.bags[S.bag]||0)<=0){const alt=BAGS.find(b=>S.bags[b.id]>0);if(alt){S.bag=alt.id;renderTray();toast(`Cambiado a ${alt.n.toLowerCase()}`)}else{toast("Sin bolsas. Espera un poco o pasa por la tienda.");return}}
  holding=p;holding.sx=p.x;holding.sy=p.y;pts=[p];
});
cv.addEventListener("pointermove",e=>{
  const p=pos(e);
  if(wiping){const q=pts[pts.length-1];const d=Math.hypot(p.x-q.x,p.y-q.y);pts=[p];
    for(const s of splats){if(Math.hypot(s.x-p.x,s.y-p.y)<s.r*1.3)s.a-=d*.006}return}
  if(!holding)return;p.sx=holding.sx;p.sy=holding.sy;holding=p;pts.push(p);while(pts.length>2&&p.t-pts[0].t>110)pts.shift();
});
function up(e){
  if(wiping){wiping=false;return}
  if(!holding)return;const p=pos(e);pts.push(p);const a=pts[0],drag=holding.sy-p.y;holding=null;
  const dt=Math.max(16,p.t-a.t)/1000,vx=(p.x-a.x)/dt,vy=(p.y-a.y)/dt;
  if(vy<-H*.35&&Math.hypot(p.x-a.x,p.y-a.y)>20&&canThrow()){doThrow(vx,vy,p.x,p.y,drag)}
}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",()=>{holding=null;wiping=false});

/* Bandeja */
function renderTray(){
  const bg=$("#bagSlot"),bb=$("#baitSlot");
  const c1=bg.querySelector("canvas").getContext("2d");c1.clearRect(0,0,68,68);drawBag(c1,S.bag,34,38,40);
  bg.querySelector("b").textContent=BG[S.bag].n;bg.querySelector("small").textContent=`Quedan ${S.bags[S.bag]||0} · ×${BG[S.bag].m}`;
  bg.classList.toggle("off",(S.bags[S.bag]||0)<=0);
  const c2=bb.querySelector("canvas").getContext("2d");c2.clearRect(0,0,68,68);drawBait(c2,S.bait,34,34,44);
  const bo=baitObj();bb.querySelector("b").textContent=S.bait?bo.n:"Poner cebo";
  bb.querySelector("small").textContent=S.bait?"Para el próximo lanzamiento":`Pipas ${S.baits.pipas} · Churro ${S.baits.churro} · Bocata ${S.baits.bocata}`;
  bb.classList.toggle("off",!S.bait);
}
$("#bagSlot").onclick=()=>{ac();const ids=BAGS.map(b=>b.id);let i=ids.indexOf(S.bag);for(let k=0;k<4;k++){i=(i+1)%4;if(S.bags[ids[i]]>0||k===3)break}S.bag=ids[i];save();renderTray();toast(`${BG[S.bag].n}: ${BG[S.bag].d}`,1600)};
$("#baitSlot").onclick=()=>{
  ac();if(phase!=="aim"){toast("Espera a que acabe el lanzamiento.");return}
  if(S.bait){S.baits[S.bait]++;S.bait=null;save();renderTray();return}
  const opts=BAITS.filter(b=>b.id&&S.baits[b.id]>0);if(!opts.length){toast("No tienes cebos. Hay en la tienda.");return}
  // cicla al siguiente cebo disponible
  const order=["pipas","churro","bocata"];const nxt=order.find(id=>S.baits[id]>0);
  S.bait=nxt;S.baits[nxt]--;save();renderTray();toast(`${BT[nxt].n}: ${BT[nxt].d}`,1600);
};
$("#baitSlot").addEventListener("contextmenu",e=>e.preventDefault());
$("#skip").onclick=()=>{if(phase==="aim"){bird.state="flee";phase="flee";pT=0;banner("Ni caso. Siguiente.","#b9ad9b",1)}};

/* Regeneración de bolsas */
function regenTick(){
  const now=Date.now();
  if(S.bags.super>=REGEN_MAX){S.lastRegen=now;$("#regen").hidden=true;return}
  let n=Math.floor((now-S.lastRegen)/REGEN_MS);
  if(n>0){const add=Math.min(n,REGEN_MAX-S.bags.super);S.bags.super+=add;S.lastRegen+=n*REGEN_MS;save();renderTray()}
  const left=Math.ceil((REGEN_MS-(now-S.lastRegen))/1000);
  const el=$("#regen");el.hidden=false;const txt=`+1 bolsa en 0:${String(Math.max(0,left)).padStart(2,"0")}`;if(el.textContent!==txt)el.textContent=txt;
}

function renderShop(){

  };
  for(const b of BAGS)row(c=>drawBag(c,b.id,48,54,56),b.n,`${b.d} Captura ×${b.m}.`,S.bags[b.id],b.pack,b.price,()=>S.bags[b.id]+=b.pack);
  const h=document.createElement("div");h.className="shoph";h.textContent="Cebos (duran un lanzamiento)";box.appendChild(h);
  for(const b of BAITS.slice(1))row(c=>drawBait(c,b.id,48,48,60),b.n,`${b.d} Captura ×${b.m}.`,S.baits[b.id],b.pack,b.price,()=>S.baits[b.id]+=b.pack);
  const r=document.createElement("div");r.className="shoph";r.textContent="Borrón y cuenta nueva";box.appendChild(r);
  const rb=document.createElement("button");rb.className="small-btn";rb.textContent="Borrar partida";rb.onclick=()=>{
    modal(`<h3>¿Borrar la partida?</h3><p class="desc">Pierdes el álbum, las migas y el nivel. No hay vuelta atrás.</p><div class="actions"><button class="big" id="mYes">Sí, borrar todo</button><button class="big alt" id="mNo">Mejor no</button></div>`);
    $("#mNo").onclick=closeModal;$("#mYes").onclick=()=>{S=FRESH();S.lastDay=today();save();bird=null;closeModal();hud();renderTray();show("hunt")};
  };box.appendChild(rb);
}

/* Modal */
let modalCb=null;
function modal(html,cb){
  const m=$("#modal");m.innerHTML=`<div class="card">${html}</div>`;m.hidden=false;modalCb=cb||null;
  m.querySelectorAll("canvas[data-bird]").forEach(c=>{const sp=SP[c.dataset.bird],x=c.getContext("2d");let t=0;
    const draw=()=>{if(!c.isConnected)return;x.clearRect(0,0,360,360);drawBird(x,sp,200,300,360*.2*Math.min(1,1/sp.look.size),{t,gold:c.dataset.gold==="1",sil:c.dataset.sil==="1"});t+=.016;requestAnimationFrame(draw)};draw()});
}
function closeModal(){$("#modal").hidden=true;$("#modal").innerHTML="";const cb=modalCb;modalCb=null;if(cb)cb()}

/* Regalo diario */
function today(){const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`}
function daily(){
  const t=today();if(S.lastDay===t)return false;
  const y=new Date();y.setDate(y.getDate()-1);const yest=`${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
  const first=!S.lastDay;S.days=S.lastDay===yest?S.days+1:1;S.lastDay=t;
  if(first){save();return false}
  const d=Math.min(7,S.days),migas=20*d;S.bags.super+=5;S.bags.rafia+=Math.ceil(d/2);S.baits.pipas+=1;if(d>=3)S.baits.churro+=1;if(d>=7){S.bags.red+=1;S.baits.bocata+=1}S.migas+=migas;save();hud();renderTray();
  modal(`<h3>Día ${S.days} seguido</h3><p class="desc">Las palomas te echaban de menos. Bueno, no. Pero toma esto.</p>
    <div class="rw"><div><span>Bolsas del súper</span><span>+5</span></div><div><span>Bolsas de rafia</span><span>+${Math.ceil(d/2)}</span></div><div><span>Pipas</span><span>+1</span></div>
    ${d>=3?"<div><span>Churro</span><span>+1</span></div>":""}${d>=7?"<div><span>Red de tu tío y bocata</span><span>+1 y +1</span></div>":""}<div><span>Migas</span><span>+${migas}</span></div></div>
    <p class="desc">Vuelve mañana: el regalo crece hasta el día 7.</p><div class="actions"><button class="big" id="mOk">¡A cazar!</button></div>`);
  $("#mOk").onclick=closeModal;return true;
}
function intro(){
  modal(`<h3>Palomazo</h3><canvas class="pic" width="360" height="360" data-bird="currante" data-gold="0"></canvas>
    <p class="desc">El barrio está lleno de palomas raras. Tu misión: meterlas en una bolsa del súper y completar el álbum.</p>
    <div class="rw"><div><span>Desliza hacia arriba</span><span>lanzas la bolsa</span></div><div><span>Anillo pequeño al soltar</span><span>más fácil pillarla</span></div>
    <div><span>Color del anillo</span><span>verde fácil · rojo difícil</span></div><div><span>Si te caga</span><span>frota para limpiar</span></div></div>
    <div class="actions"><button class="big" id="mOk">Empezar</button></div>`);
  $("#mOk").onclick=()=>{ac();closeModal()};
}

/* Arranque */
window.addEventListener("resize",()=>resize());
hud();renderTray();newBadge();
requestAnimationFrame(()=>{resize();spawn();if(!S.lastDay){daily();intro()}else daily();requestAnimationFrame(loop)});
</script>
<!--FIN-->
